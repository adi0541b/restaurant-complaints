# Template konfigurasi Nginx untuk reverse proxy ke Gunicorn.
#
# Webuzo umumnya sudah membuatkan file vhost dasar untuk domain Anda saat
# domain ditambahkan lewat panel. Anda punya dua opsi:
#
#   A) Jika Webuzo menyediakan kolom "Custom Nginx Directives" / "Additional
#      Nginx Config" di pengaturan domain -> tempelkan ISI blok "location /"
#      dan "location /static/" serta "location /media/" di bawah ke sana.
#
#   B) Jika Anda punya akses SSH root penuh -> salin seluruh isi file ini ke
#      /etc/nginx/conf.d/restaurant-complaints.conf (atau ke folder vhost
#      yang dipakai Webuzo untuk domain ini, cek di /usr/local/apps/webuzo/...
#      atau /etc/nginx/conf.d/domains/), lalu jalankan:
#         nginx -t && systemctl reload nginx
#
# Sesuaikan "sinergiberkahsukses.com" dan semua path dengan kondisi server
# Anda yang sebenarnya.

server {
    listen 80;
    server_name sinergiberkahsukses.com www.sinergiberkahsukses.com;

    # Setelah SSL aktif (Let's Encrypt/AutoSSL dari Webuzo), Webuzo biasanya
    # otomatis menambahkan blok redirect ke HTTPS dan blok "listen 443 ssl"
    # terpisah. Biarkan itu apa adanya; cukup pastikan blok location di bawah
    # ini ada di kedua blok server (port 80 redirect & port 443 ssl).

    client_max_body_size 10M;

    location /static/ {
        alias /home/webuzo_user/public_html/restaurant_complaints/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /home/webuzo_user/public_html/restaurant_complaints/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

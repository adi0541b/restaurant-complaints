databases:
  - name: restaurant-complaints-db
    plan: free
    databaseName: restaurant_complaints
    user: restaurant_complaints_user

services:
  - type: web
    name: restaurant-complaints
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn restaurant_complaints.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: RESTAURANT_BRAND_NAME
        value: "Rasa Nusantara"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-complaints-db
          property: connectionString
